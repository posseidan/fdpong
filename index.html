<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDPong Shuffle</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game">

        <!-- Linke Pyramide -->
        <div class="rack left-rack">

            <div class="row row1">
                <div class="slot"><div class="circle pink" draggable="true"></div></div>
            </div>

            <div class="row row2">
                <div class="slot"><div class="circle yellow" draggable="true"></div></div>
                <div class="slot"><div class="circle red" draggable="true"></div></div>
            </div>

            <div class="row row3">
                <div class="slot"><div class="circle blue" draggable="true"></div></div>
                <div class="slot"><div class="circle pink" draggable="true"></div></div>
                <div class="slot"><div class="circle blue" draggable="true"></div></div>
            </div>

            <div class="row row4">
                <div class="slot"><div class="circle black" draggable="true"></div></div>
                <div class="slot"><div class="circle red" draggable="true"></div></div>
                <div class="slot"><div class="circle yellow" draggable="true"></div></div>
                <div class="slot"><div class="circle black" draggable="true"></div></div>
            </div>
            <div class="row row5">
                <div class="slot"><div class="circle black" draggable="true"></div></div>
                <div class="slot"><div class="circle red" draggable="true"></div></div>
                <div class="slot"><div class="circle yellow" draggable="true"></div></div>
                <div class="slot"><div class="circle blue" draggable="true"></div></div>
                <div class="slot"><div class="circle pink" draggable="true"></div></div>
            </div>
        </div>


        <!-- Rechte Pyramide -->
        <div class="rack right-rack">

            <div class="row row1">
                <div class="slot"><div class="circle pink" draggable="true"></div></div>
            </div>

            <div class="row row2">
                <div class="slot"><div class="circle yellow" draggable="true"></div></div>
                <div class="slot"><div class="circle red" draggable="true"></div></div>
            </div>

            <div class="row row3">
                <div class="slot"><div class="circle blue" draggable="true"></div></div>
                <div class="slot"><div class="circle pink" draggable="true"></div></div>
                <div class="slot"><div class="circle blue" draggable="true"></div></div>
            </div>

            <div class="row row4">
                <div class="slot"><div class="circle black" draggable="true"></div></div>
                <div class="slot"><div class="circle red" draggable="true"></div></div>
                <div class="slot"><div class="circle yellow" draggable="true"></div></div>
                <div class="slot"><div class="circle black" draggable="true"></div></div>
            </div>
            <div class="row row5">
                <div class="slot"><div class="circle black" draggable="true"></div></div>
                <div class="slot"><div class="circle red" draggable="true"></div></div>
                <div class="slot"><div class="circle yellow" draggable="true"></div></div>
                <div class="slot"><div class="circle blue" draggable="true"></div></div>
                <div class="slot"><div class="circle pink" draggable="true"></div></div>
            </div>
        </div>
    </div>
    <div id="bottom-area">
        
        <div id="extra-area">
            <div class="extra-circles">
                <div class="circle white"></div>
                <div class="circle white"></div>
                <div class="circle white"></div>
                <div class="circle white"></div>
                <div class="circle white"></div>

                <div class="circle white"></div>
                <div class="circle white"></div>
                <div class="circle white"></div>
                <div class="circle white"></div>
                <div class="circle white"></div>
            </div>
        </div>
    <label>
        <input type="checkbox" id="toggleRow5Checkbox" checked>
        5. Reihe anzeigen
    </label>
    <button id="shuffleButton">Mischen</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
